[phases.setup]
nixPkgs = ["php82",
  "php82Packages.composer",
  "nodejs",
  "pnpm",
  "php82Extensions.gd",
  "php82Extensions.pdo",
  "php82Extensions.pdo_mysql"]

[phases.build]
cmds = ["composer install  --optimize-autoloader",
  "pnpm install",
  "pnpm run build"]

[start]
cmd = "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"